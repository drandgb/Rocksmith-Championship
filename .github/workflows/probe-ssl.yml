name: probe-ssl (temporary)
on:
  push:
    branches: [probe-ssl]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Save the Song Selection List and Songs Played tabs
        run: |
          mkdir out
          ID=1HzgY90kLwyGqzJ-R64v8lmpeQMMhhxwGwUlenepIgms
          curl -sL "https://docs.google.com/spreadsheets/d/$ID/export?format=csv&gid=783523676" -o out/ssl.csv
          curl -sL "https://docs.google.com/spreadsheets/d/$ID/gviz/tq?tqx=out:csv&sheet=Songs%20Played" -o out/played.csv
          wc -l out/*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: ssl
          path: out
          retention-days: 1
