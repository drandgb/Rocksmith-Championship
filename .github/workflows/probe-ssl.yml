name: probe-ssl (temporary)
on:
  push:
    branches: [probe-ssl]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Show the Song Selection List layout
        run: |
          python3 - <<'PY'
          import csv, io, urllib.request
          ID="1HzgY90kLwyGqzJ-R64v8lmpeQMMhhxwGwUlenepIgms"
          for gid in ["Songs Played"]:
              url=f"https://docs.google.com/spreadsheets/d/{ID}/gviz/tq?tqx=out:csv&sheet=Songs%20Played"
              t=urllib.request.urlopen(url,timeout=60).read().decode("utf-8")
              rows=list(csv.reader(io.StringIO(t)))
              print("gid",gid,"rows",len(rows),"cols",max(len(r) for r in rows))
              for i,r in enumerate(rows[:4]+rows[-3:]): print(i,[c[:50] for c in r])
              # how filled each column is
              n=max(len(r) for r in rows)
              print("filled per column:",[sum(1 for r in rows if i<len(r) and r[i].strip()) for i in range(n)])
              pass
          PY
