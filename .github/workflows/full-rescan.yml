name: Full rescan (whole sheet)

on:
  schedule:
    - cron: "7 7 * * 0"     # Sundays 07:47 UTC (3:47am New York); re-reads every week tab, so corrections to old weeks show up
  workflow_dispatch:          # "Run workflow" button on the Actions tab
    inputs:
      edited:
        description: "When the scoreboard sheet was last edited (ISO time, sent by the sheet's updateWebsite script)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write

concurrency:
  group: update-site   # never run both at once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install openpyxl
        run: pip install openpyxl==3.1.5

      - name: Download the sheet and build index.html
        env:
          SHEET_EDITED: ${{ inputs.edited }}
        run: |
          export BUILD_DATE=$(TZ=America/New_York date +%F)
          MODE=full ./build/build.sh 2>&1 | tee build.log

      - name: Check the new page (every tab, on a computer and a phone)
        id: check
        run: |
          set +e
          pip install playwright==1.56.0 > /dev/null 2>&1
          python3 build/check_page.py index.html > check.log 2>&1; code=$?
          cat check.log; cat check.log >> build.log
          if [ $code -ne 0 ]; then
            echo "::error::The new page has problems (listed above), so the site keeps its last good page."
            git checkout -- index.html
            echo "bad=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check nothing private is about to be committed (secret keys, passwords, email addresses)
        id: secrets
        run: |
          set +e
          python3 build/check_secrets.py > "$RUNNER_TEMP/secrets.log" 2>&1; code=$?
          cat "$RUNNER_TEMP/secrets.log"; cat "$RUNNER_TEMP/secrets.log" >> build.log
          if [ $code -ne 0 ]; then
            echo "::error::Something private (listed above) would have been committed to this public repository, so nothing was committed."
            echo "bad=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit if anything changed
        id: commit
        if: steps.secrets.outputs.bad != 'true'
        run: |
          # ignore the "Site last updated" / "Scores last updated" lines (kept on their own lines in the template) so the site only changes when the data or page does
          if git diff --quiet -I 'ast updated:' -- index.html && [ -z "$(git status --porcelain -- build/data/cache ratings.json weekposts.json)" ]; then
            git checkout -- index.html
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            grep -o 'id="builtat" data-iso="[^"]*"' index.html | head -1 | sed 's/.*data-iso="//;s/"$//' > version.txt   # the page checks this to offer a refresh
            grep -o 'data-sc="[^"]*" data-cv="[^"]*"' index.html | head -1 | sed 's/data-sc="//;s/" data-cv="/ /;s/"$//' >> version.txt   # score and page fingerprints: "new scores" or "site update"
            git add index.html version.txt build/data/cache; [ -f ratings.json ] && git add ratings.json || true; [ -f weekposts.json ] && git add weekposts.json || true
            git commit -m "Full rescan of the scoreboard sheet (week $(cat build/work/data_week.txt))"
            git pull --rebase -X theirs origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to republish
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick up the commit on its own."

      - name: Mark the run as failed if the new page had problems or something private was found (GitHub emails you)
        if: steps.check.outputs.bad == 'true' || steps.secrets.outputs.bad == 'true'
        run: exit 1

      - name: Save the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
