name: Check a draft

# Every push to a draft branch: build the page from the current scoreboard sheet with the draft's code, then open
# every tab in headless Chrome (on a computer and a phone) and fail if a tab is empty or the code hits an error.
# Nothing is committed. Main is checked by the site updates themselves, which keep the last good page if a check fails.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install openpyxl and playwright
        run: pip install openpyxl==3.1.5 playwright==1.56.0

      - name: Build the draft page
        run: OUT=../../_check.html MODE=quick ./build/build.sh

      - name: Check every tab
        run: python3 build/check_page.py _check.html
