name: Check a draft

# Every push to a draft branch: build the page from the current scoreboard sheet with the draft's code, then open
# every tab in headless Chrome (on a computer and a phone) and fail if a tab is empty, the code hits an error or two
# functions share a name, or a section that has content on the live page is gone, hidden or mostly empty in the draft.
# Also fail if the draft has anything private in it (secret keys, passwords, email addresses).
# Nothing is committed. Main is checked by the site updates themselves, which keep the last good page if a check fails.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install openpyxl and playwright
        run: pip install openpyxl==3.1.5 playwright==1.56.0

      - name: Check nothing private is in the draft (secret keys, passwords, email addresses)
        run: python3 build/check_secrets.py

      - name: Build the draft page
        run: OUT=../../_check.html MODE=quick ./build/build.sh

      - name: Check every tab, and every section against the live page
        run: |
          git fetch -q --depth=1 origin main
          git show origin/main:index.html > _live.html
          python3 build/check_page.py _check.html --compare _live.html
